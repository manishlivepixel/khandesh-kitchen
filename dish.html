<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dish Details — Khandesh Kitchen</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@400;500;600;700;800&family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dish-page { min-height: 100vh; background: var(--dark); padding: 4rem 0; color: var(--cream); }
    .dish-card { background: var(--dark-2); border-radius: 24px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-lg); }
    .dish-img { width: 100%; height: 380px; object-fit: cover; }
    .dish-content { padding: 3rem; }
    .dish-title-mr { font-family: var(--f-display); font-size: 2.8rem; color: var(--gold); margin-bottom: 0.2rem; }
    .dish-title-en { font-family: var(--f-sub); font-size: 1.2rem; color: rgba(246,237,217,.6); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .dish-desc { font-size: 1.1rem; line-height: 1.8; color: rgba(246,237,217,.85); margin-bottom: 2.5rem; }
    .dish-price { font-family: var(--f-display); font-size: 1.8rem; color: var(--gold-light); display: inline-block; padding: 0.5rem 1.5rem; border: 2px dashed var(--line); border-radius: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--gold); margin-bottom: 2rem; font-family: var(--f-sub); font-weight: 700; font-size: 1.1rem; transition: transform 0.2s; }
    .back-btn:hover { transform: translateX(-4px); }
    @media(max-width: 768px) { .dish-content { padding: 2rem; } .dish-title-mr { font-size: 2.2rem; } .dish-img { height: 260px; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar__inner">
      <span class="topbar__item">Patil Pada, Katrap, Badlapur 421503</span>
    </div>
  </div>

  <section class="dish-page">
    <div class="container">
      <a href="index.html#menu" class="back-btn" data-i18n="← Back to Menu">← Back to Menu</a>
      <div class="dish-card" id="dishCard" style="display:none;">
        <img src="" alt="" class="dish-img" id="dImg">
        <div class="dish-content">
          <h1 class="dish-title-mr" id="dTitleMr"></h1>
          <div class="dish-title-en" id="dTitleEn"></div>
          <p class="dish-desc" id="dDesc"></p>
          <div class="dish-price" id="dPrice"></div>
        </div>
      </div>
      <div id="errorMsg" style="display:none; text-align:center; padding: 4rem;">
        <h2 class="h2 h2--light">Dish not found</h2>
        <a href="index.html#menu" class="btn btn--gold" style="margin-top:2rem;">Explore Menu</a>
      </div>
    </div>
  </section>

  <script>
    const dishData = {"shev-bhaji": {"title_en": "Shev Bhaji", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0936\u0947\u0935 \u092d\u093e\u091c\u0940", "image": "assets/images/dish-shev-bhaji.jpg", "desc": "A fiery, vibrant Khandeshi delicacy where crisp chickpea flour noodles (shev) are submerged in a spicy, deep red curry. Prepared with our secret freshly ground black masala, this dish packs a powerful punch of flavor.", "price": "\u20b9120"}, "vangyache-bharit": {"title_en": "Vangyache Bharit", "title_mr": "\u0935\u093e\u0902\u0917\u094d\u092f\u093e\u091a\u0947 \u092d\u0930\u093f\u0924", "image": "assets/images/dish-vangyache-bharit.jpg", "desc": "Smoky, fire-roasted eggplant mashed and tempered with Khandeshi green chilies, garlic, and spring onions. A rustic comfort food that pairs beautifully with hot bhakri.", "price": "\u20b9110"}, "pithle": {"title_en": "Pithle", "title_mr": "\u092a\u093f\u0920\u0932\u0947 \u2013 \u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0938\u094d\u091f\u093e\u0908\u0932", "image": "assets/images/dish-pithle.jpg", "desc": "A traditional Maharashtrian chickpea flour curry, cooked to a creamy, savory perfection with garlic, mustard seeds, and curry leaves. The ultimate comfort meal.", "price": "\u20b990"}, "bhoplya-bhaji": {"title_en": "Bhoplya Bhaji", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u092d\u094b\u092a\u0933\u094d\u092f\u093e\u091a\u0940 \u092d\u093e\u091c\u0940", "image": "assets/images/dish-bhoplya-bhaji.jpg", "desc": "Sweet and savory pumpkin curry tempered with earthy spices. A mild yet deeply flavorful sabzi that highlights the natural sweetness of the pumpkin.", "price": "\u20b9100"}, "batatyachi-bhaji": {"title_en": "Batatyachi Bhaji", "title_mr": "\u092c\u091f\u093e\u091f\u094d\u092f\u093e\u091a\u0940 \u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u092d\u093e\u091c\u0940", "image": "assets/images/dish-batatyachi-bhaji.jpg", "desc": "A humble yet irresistible dry potato preparation with turmeric, mustard seeds, and fresh coriander. Simple, homestyle, and absolutely delicious.", "price": "\u20b990"}, "bhakri": {"title_en": "Bhakri", "title_mr": "\u092d\u093e\u0915\u0930\u0940 (\u092c\u093e\u091c\u0930\u0940 / \u091c\u094d\u0935\u093e\u0930\u0940)", "image": "assets/images/dish-bhakri.jpg", "desc": "Thick, rustic flatbreads made from Bajri (pearl millet) or Jwari (sorghum). Hand-pressed and roasted on an iron tawa until crisp on the outside and soft inside.", "price": "\u20b920"}, "thecha": {"title_en": "Thecha", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0924\u0947\u091a (\u0932\u0938\u0923\u0940 / \u091c\u093f\u0930\u0947)", "image": "assets/images/dish-thecha.jpg", "desc": "The legendary Khandeshi accompaniment! A fiercely spicy, coarse chutney made by pounding fresh green or red chilies with garlic, peanuts, and salt.", "price": "\u20b940"}, "chapati": {"title_en": "Chapati", "title_mr": "\u091a\u092a\u093e\u0924\u0940", "image": "assets/images/dish-chapati.jpg", "desc": "Soft, thin whole wheat flatbreads, perfect for scooping up our rich gravies and dry sabzis.", "price": "\u20b915"}, "rice-plate": {"title_en": "Rice Plate", "title_mr": "\u092d\u093e\u0924 \u2013 \u092a\u094b\u0933\u094d\u092f\u093e \u0938\u0947\u091f", "image": "https://upload.wikimedia.org/wikipedia/commons/4/49/Vegetarian_Curry.jpeg", "desc": "A comforting portion of steaming hot Indrayani or Kolam rice, served with our signature homestyle amti or dal.", "price": "\u20b980"}, "khandeshi-kadhi": {"title_en": "Khandeshi Kadhi", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0915\u0922\u0940", "image": "assets/images/dish-khandeshi-kadhi.jpg", "desc": "A tangy, subtly sweet and spicy yogurt-based soup tempered with ginger, garlic, and curry leaves. The perfect palate cleanser.", "price": "\u20b970"}, "mutton-rassa": {"title_en": "Mutton Rassa", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u092e\u091f\u0923 \u0930\u0938\u094d\u0938\u093e (\u0924\u093f\u0916\u091f)", "image": "assets/images/dish-mutton-rassa.jpg", "desc": "Our signature! Tender pieces of mutton slow-cooked in a fiery, dark Khandeshi rassa. The broth is rich with roasted dry coconut and our house-special black masala.", "price": "\u20b9280"}, "dry-mutton": {"title_en": "Dry Mutton", "title_mr": "\u092e\u091f\u0923 \u0938\u0941\u0916\u093e \u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0938\u094d\u091f\u093e\u0908\u0932", "image": "https://upload.wikimedia.org/wikipedia/commons/8/80/Bengali_Mutton_Curry.JPG", "desc": "Succulent mutton pieces stir-fried until the rich, spicy masala clings to the meat. A dry preparation packed with intense, smoky flavors.", "price": "\u20b9300"}, "mutton-bhakri-thali": {"title_en": "Mutton Bhakri Thali", "title_mr": "\u092e\u091f\u0923 \u092d\u093e\u0915\u0930\u0940 \u0925\u093e\u0932\u0940", "image": "https://upload.wikimedia.org/wikipedia/commons/4/49/Vegetarian_Curry.jpeg", "desc": "The ultimate Khandeshi feast. Features our spicy Mutton Rassa, Dry Mutton, hot Bhakris, Indrayani rice, and a slice of raw onion with lemon.", "price": "\u20b9320"}, "chicken-rassa": {"title_en": "Chicken Rassa", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u091a\u093f\u0915\u0928 \u0930\u0938\u094d\u0938\u093e", "image": "assets/images/dish-chicken-rassa.jpg", "desc": "Homestyle chicken curry cooked in a fiery Khandeshi red broth. A soul-warming dish with a perfect balance of heat and flavor.", "price": "\u20b9240"}, "kanda-lasuni": {"title_en": "Kanda Lasuni", "title_mr": "\u091a\u093f\u0915\u0928 \u0915\u093e\u0902\u0926\u093e \u0932\u0938\u0923\u0940", "image": "https://upload.wikimedia.org/wikipedia/commons/0/00/Chicken_tikka_masala_%28cropped%29.jpg", "desc": "Chicken cooked in a rich, deeply caramelized onion and garlic base. The slow roasting process gives this dish an irresistible savory depth.", "price": "\u20b9250"}, "dry-chicken": {"title_en": "Dry Chicken", "title_mr": "\u091a\u093f\u0915\u0928 \u0938\u0941\u0916\u093e", "image": "https://upload.wikimedia.org/wikipedia/commons/e/e1/Chickentandoori.jpg", "desc": "Spicy, pan-roasted chicken tossed in robust dry spices and fresh coriander. Perfect as a starter or alongside dal and rice.", "price": "\u20b9260"}, "khandeshi-egg-curry": {"title_en": "Khandeshi Egg Curry", "title_mr": "\u0905\u0902\u0921\u0940 \u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940", "image": "assets/images/dish-khandeshi-egg-curry.jpg", "desc": "Boiled eggs simmered in a robust, spicy onion-tomato and coconut gravy. A hearty and satisfying classic.", "price": "\u20b9120"}, "3-sabzi-bhakri-rice-kadhi-thecha": {"title_en": "3 sabzi, bhakri, rice, kadhi, thecha", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0935\u094d\u0939\u0947\u091c \u0925\u093e\u0932\u0940", "image": "https://upload.wikimedia.org/wikipedia/commons/4/49/Vegetarian_Curry.jpeg", "desc": "A wholesome, complete Khandeshi vegetarian thali featuring the day's fresh sabzis, hot bhakris, fragrant rice, kadhi, and spicy thecha.", "price": "\u20b9150"}, "seasonal-sabzi-plus-sweet": {"title_en": "Seasonal sabzi + sweet", "title_mr": "\u0916\u093e\u0928\u094d\u0926\u0947\u0936\u0940 \u0938\u094d\u092a\u0947\u0936\u0932 \u0925\u093e\u0932\u0940", "image": "https://upload.wikimedia.org/wikipedia/commons/4/49/Vegetarian_Curry.jpeg", "desc": "Our special vegetarian thali with premium seasonal preparations, an extra sabzi, and a traditional sweet dish to complete the meal.", "price": "\u20b9180"}, "mutton-thali-with-bhakri": {"title_en": "Mutton thali with bhakri", "title_mr": "\u092e\u091f\u0923 \u0925\u093e\u0932\u0940", "image": "https://upload.wikimedia.org/wikipedia/commons/4/49/Vegetarian_Curry.jpeg", "desc": "A grand non-vegetarian spread with our signature Mutton Rassa, Sukha Mutton, soft Bhakris, Rice, and fiery accompaniments.", "price": "\u20b9320"}, "onion-bhaji": {"title_en": "Onion Bhaji", "title_mr": "\u0915\u093e\u0902\u0926\u093e \u092d\u091c\u0940", "image": "assets/images/dish-onion-bhaji.jpg", "desc": "Crisp, golden-fried onion fritters seasoned with carom seeds and fresh coriander. The perfect hot snack.", "price": "\u20b960"}, "batata-vada": {"title_en": "Batata Vada", "title_mr": "\u092c\u091f\u093e\u091f\u093e \u0935\u0921\u093e", "image": "https://upload.wikimedia.org/wikipedia/commons/8/8b/Mumbai-vada.jpg", "desc": "Spiced mashed potato balls dipped in chickpea batter and deep-fried to golden perfection. A quintessential Maharashtrian favorite.", "price": "\u20b950"}, "buttermilk-ambil": {"title_en": "Buttermilk / Ambil", "title_mr": "\u0924\u093e\u0915 / \u0906\u092e\u094d\u092c\u093f\u0932", "image": "https://upload.wikimedia.org/wikipedia/commons/f/f9/Mint_lassi.jpg", "desc": "Traditional spiced buttermilk or Ambil (fermented millet cooler) to soothe your palate after a fiery Khandeshi meal.", "price": "\u20b930"}, "unlimited-on-thali": {"title_en": "Unlimited on thali", "title_mr": "\u0938\u094b\u0932\u093e\u092a\u0941\u0930\u0940 \u0915\u0922\u0940 + \u092d\u093e\u0924", "image": "https://upload.wikimedia.org/wikipedia/commons/6/67/Kadhi_Pakora.jpg", "desc": "Enjoy unlimited servings of our fragrant rice and Solapuri-style kadhi with your thali.", "price": "\u2014"}};
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const data = dishData[id];
    
    if(data) {
      document.getElementById('dishCard').style.display = 'flex';
      document.getElementById('dImg').src = data.image;
      document.getElementById('dImg').alt = data.title_en;
      document.getElementById('dTitleMr').textContent = data.title_mr || data.title_en;
      document.getElementById('dTitleEn').textContent = data.title_en;
      document.getElementById('dDesc').textContent = data.desc;
      document.getElementById('dPrice').textContent = data.price;
      document.title = (data.title_mr || data.title_en) + " — Khandesh Kitchen";
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>

    

  <script src="js/translations.js"></script>
</body>
</html>
